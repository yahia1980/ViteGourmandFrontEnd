<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Vite & Gourmand, service traiteur à Bordeaux. Découvrez nos menus pour vos événements.">

    <title>Vite & Gourmand | Service traiteur</title>

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="stylesheet" href="/src/css/header.css">
    <link rel="stylesheet" href="/src/css/footer.css">

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>

    <div class="container">

        <!-- =========================
             HEADER
        ========================= -->

        <header>

            <div class="containerHeader">

                <!-- LOGO -->
                <div class="logo">
                    Vite<span class="logo_vG">&amp;</span><br>
                    Gourmand
                </div>

                <!-- MENU HAMBURGER -->
                <button type="button" id="hamburger" class="hamburger" aria-label="Ouvrir le menu"
                    aria-controls="navbar" aria-expanded="false">

                    <span class="topLine"></span>
                    <span class="mediumLine"></span>
                    <span class="bottomLine"></span>

                </button>

            </div>

            <!-- NAVIGATION -->
            <nav id="navbar" class="navbar" aria-label="Navigation principale">

                <ul>
                    <li>
                        <a href="/">Accueil</a>
                    </li>

                    <li>
                        <a href="/menus">Menus</a>
                    </li>

                    <li>
                        <a href="/contact">Contact</a>
                    </li>

                    <li>
                        <a href="/compte" id="lienCompte" class="lienCompte disabled" aria-disabled="true"
                            tabindex="-1">
                            Mon compte
                        </a>
                    </li>

                    <li>
                        <a href="/connexion" id="authLink">
                            Connexion
                        </a>
                    </li>
                </ul>

            </nav>

        </header>

        <!-- =========================
             CONTENU PRINCIPAL SPA
        ========================= -->

        <main id="main-page"></main>

        <!-- =========================
             FOOTER
        ========================= -->

        <footer>

            <div class="containerFooter full_width">

                <!-- HORAIRES -->
                    <div class="horaire center flexColumn">

                        <h2>Horaires</h2>

                        <div id="horairesFooter">
                            <p>Chargement des horaires...</p>
                        </div>

                    </div>

                    <!-- INFORMATIONS -->
                    <div class="information center flexColumn">

                        <h2>Informations</h2>

                        <a href="/mention-legale">
                            Mentions légales
                        </a>

                        <a href="/cgv">
                            Conditions générales de vente
                        </a>

                    </div>

            </div>

        </footer>

    </div>

    <!-- ROUTEUR SPA -->
    <script type="module" src="/Router/router.js"></script>
    <script type="module" src="/src/js/valide-form.js"></script>
    <script type="module" src="/src/js/footer.js"></script>

</body>

</html>
