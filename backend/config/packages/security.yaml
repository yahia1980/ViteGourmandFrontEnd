
security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    role_hierarchy:
        ROLE_ADMIN: ROLE_EMPLOYE
        ROLE_EMPLOYE: ROLE_USER

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            user_checker: App\Security\UtilisateurChecker

            json_login:
                check_path: /api/connexion
                login_path: /api/connexion
                username_path: email
                password_path: password

            logout:
                path: /api/deconnexion
                invalidate_session: true
                enable_csrf: false

    access_control:
        - { path: ^/api/connexion$, roles: PUBLIC_ACCESS }
        - { path: ^/api/inscription$, roles: PUBLIC_ACCESS }

        # API administrateur
        - { path: ^/api/admin(?:/|$), roles: ROLE_ADMIN }

        # API employé
        - { path: ^/api/employe(?:/|$), roles: ROLE_EMPLOYE }

        # API commandes
        - { path: ^/api/commandes(?:/|$), roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10


