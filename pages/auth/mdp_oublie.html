<div class="formMdpOublie">
  <h2 class="titleForm">Changement de mot de passe</h2>
  <div class="mdpoublieGrid">
    <form>
      <div class="formMdpOublieMail">
        <label for="email"><i class="fa-solid fa-at"></i> Email </label>
        <input type="email" id="email" name="email" required />
      </div>
      <div class="passwordFormMdpOublie">
        <label for="password"
          ><i class="fa-solid fa-lock"></i>Noveau mot de passe
        </label>
        <input type="password" id="password" name="mdp" required />
      </div>
      <div class="btnMdpOublie">
        <button type="submit" class="btnStyleCh">Changer le mot de passe</button>
        <div class="lienCompte">
           <a href="/compte">Retour à mon compte</a>
        </div>
       
      </div>
    </form>
  </div>
</div>
