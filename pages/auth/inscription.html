<div class="inscriptionForm">
        <div class="inscriptionGrid">
            <h3 class="titleForm">Inscrivez-vous</h3>
    <form>
            <div class="prenomForm formInscriptionPrenom">
                <label for="prenom">
                Prénom
                </label>
                <input
                type="text"
                id="prenom"
                name="prenom"
                required>
            </div>
            <div class="nomForm formInscriptionNom">
                <label for="nom">
                Nom
                </label>
                <input
                type="text"
                id="nom"
                name="nom"
                required>
            </div>
            <div class="mailForm formInscriptionMail">
                <label for="email">
                Email
                </label>
                <input
                type="email"
                id="email"
                name="email"
                required >
            </div>         
            <div class="telForm">
                <label for="tel">
                Téléphone
                </label>
                <input
                type="tel"
                id="tel"
                name="tel"
                required>
            </div>                 
            <div class="addressForm">
                <label for="address">
                Adresse
                </label>
                <input
                type="text"
                id="address"
                name="address"
                required>
            </div>         
            <div class="villeForm">
                <label for="ville">
                Ville
                </label>
                <input
                type="text"
                id="ville"
                name="ville"
                required>
            </div>
               <div class="postaleForm">
                <label for="postale">
                Code postale
                </label>
                <input
                type="text"
                id="postale"
                name="postale"
                inputmode="numeric"
                required>
            </div>         
            <div class="passwordForm">
                <label for="password">
                Mot de passe
                </label>
                <input type="password"
                id="password"
                name="mdp"
                required>
            </div>  
             <div class="confirmPasswordForm">
                <label for="confirmPassword">
                Confirmer le mot de passe
                </label>
                <input type="password"
                id="confirmPassword"
                name="confirmMdp"
                required>
            </div>                
            <div class="InscriptionEnvoi">
                <button type="submit" id="submitForm" class="btnStyleCom">S'inscrire</button>
            </div>
               </form>
        </div>      
 
<div class="imageInscription">
    <h2 class="bigTitleInscription">Inscription</h2>
    <img
        src="/images/imagesBanniere/imageInscription.jpg"
        alt="Un plat préparé par Vite&Gourmand"
    >
</div>
</div>
