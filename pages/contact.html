
<section class="containerForms contactForm">

    <!-- IMAGE ET TITRE -->
    <div class="imageForm imageFormContact">

        <h1 class="bigTitle">Contact</h1>

        <img
            src="/images/imagesBanniere/imageContact.jpg"
            alt="Présentation du service traiteur Vite & Gourmand"
        />

    </div>

    <!-- FORMULAIRE DE CONTACT -->
    <div class="formForm">

        <h2 class="titleForm">Contactez-nous</h2>

        <form id="formContact" class="formulaireMessage" method="post">

            <div class="formGrid contactGrid">

                <!-- PRÉNOM -->
                <div class="prenomForm">

                    <label for="contactPrenom">
                        Prénom
                    </label>

                    <input
                        type="text"
                        id="contactPrenom"
                        name="prenom"
                        autocomplete="given-name"
                        required
                    />

                </div>

                <!-- NOM -->
                <div class="nomForm">

                    <label for="contactNom">
                        Nom
                    </label>

                    <input
                        type="text"
                        id="contactNom"
                        name="nom"
                        autocomplete="family-name"
                        required
                    />

                </div>

                <!-- EMAIL -->
                <div class="mailForm">

                    <label for="contactEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="contactEmail"
                        name="email"
                        autocomplete="email"
                        required
                    />

                </div>

                <!-- MESSAGE -->
                <div class="areaForm">

                    <label for="contactMessage">
                        Votre message
                    </label>

                    <textarea
                        id="contactMessage"
                        name="message"
                        rows="5"
                        required
                    ></textarea>

                </div>

                <!-- BOUTON -->
                <div class="btnForm btnContact">

                    <button
                        type="submit"
                        class="submitForm btnCon">
                        Envoyer
                    </button>

                </div>

            </div>

        </form>

    </div>

    <!-- COORDONNÉES -->
    <div class="coordContact">

        <p>
            <i class="fa-solid fa-square-phone"
               aria-hidden="true"></i>

            <a href="tel:0112236245">
                01 12 23 62 45
            </a>
        </p>

        <p>
            <i class="fa-solid fa-at"
               aria-hidden="true"></i>

            <a href="mailto:vite.gourmand@gmail.com">
                vite.gourmand@gmail.com
            </a>
        </p>

        <address>
            <i class="fa-solid fa-map-pin"
               aria-hidden="true"></i>

            125 Rue vite gourmand, 33000 Bordeaux, France
        </address>

    </div>

</section>
