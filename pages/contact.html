<div class="containerForms contactForm">
  <div class="formForm">
    <h3 class="titleForm">Contactez-Nous</h3>
    <form>
      <div class="formGrid contactGrid">
        <div class="prenomForm">
          <label for="prenom"> Prénom </label>
          <input type="text" id="prenom" name="prenom" required />
        </div>
        <div class="nomForm">
          <label for="nom"> Nom </label>
          <input type="text" id="nom" name="nom" required />
        </div>
        <div class="mailForm">
          <label for="email"> Email </label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="areaForm">
          <label for="text">Rédigez votre message ici...</label>
          <textarea id="text" name="text" required
          ></textarea>
        </div>
        <div class="btnForm btnContact">
          <button type="submit" class="submitForm btnCon">Envoyer</button>
        </div>
      </div>
    </form>
  </div>
  <div class="imageForm imageFormContact">
    <h2 class="bigTitle">Contact</h2>
    <img
      src="/images/imagesBanniere/imageContact.jpg"
      alt="Un plat préparé par Vite&Gourmand"
    />
  </div>
  <div class="coordContact">
    <p><i class="fa-solid fa-square-phone"></i><a href="tel:0112236245">01 12 23 62 45</a></p>
    <p><i class="fa-solid fa-at"></i><a href="mailto:vite.gourmand@gmail.com">vite.gourmand@gmail.com</a></p>
    <address>
      <i class="fa-solid fa-map-pin"></i>
      125 Rue vite gourmand, 33000
      Bordeaux, France 
    </address>
  </div>
</div>
